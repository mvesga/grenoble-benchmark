<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Acceso protegido</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1a1a18;--soft:#5a5850;--accent:#2d5a3d;--line:#e0dbd3;--err:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171815;--card:#21231f;--ink:#ecebe6;--soft:#b8b5ab;--accent:#7fb58f;--line:#34362f;--err:#e57366}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px;
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.box{width:100%;max-width:380px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:32px 28px}
.lock{font-size:28px;margin-bottom:10px}
h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:28px;line-height:1.2;margin-bottom:6px}
p{font-size:14px;color:var(--soft);margin-bottom:20px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
button{margin-top:14px;width:100%;font:inherit;font-weight:600;font-size:15px;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible{outline:3px solid #c8960a;outline-offset:2px}
.err{color:var(--err);font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="lock" aria-hidden="true">🔒</div>
  <h1>Documento privado</h1>
  <p>Directorio de abogados · Grenoble. Introduce la contraseña de la familia para abrirlo.</p>
  <label for="pw">Contraseña</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">Abrir</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Abriendo…'; err.textContent = '';
  try {
    const data = b64(PAYLOAD_B64), salt = data.slice(0,32), iv = data.slice(32,44), ct = data.slice(44);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct));
    document.open(); document.write(html); document.close();
  } catch (x) {
    err.textContent = 'Contraseña incorrecta. Inténtalo de nuevo.';
    btn.disabled = false; btn.textContent = 'Abrir';
    document.getElementById('pw').select();
  }
});
